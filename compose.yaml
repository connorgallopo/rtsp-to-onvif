services:
  rtsp-to-onvif:
    image: ghcr.io/connorgallopo/rtsp-to-onvif:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./config.yaml:/onvif.yaml
    # Uncomment for verbose trace logging during setup
    # environment:
    #   DEBUG: "1"
